<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pleroma - Gradient Animation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      background: linear-gradient(45deg, #1e293b, #0f172a);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }
    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      position: relative;
      z-index: 1;
    }
    h1 {
      font-size: 4rem;
      color: white;
      margin-bottom: 1rem;
    }
    p {
      color: #d1d5db;
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }
    button {
      padding: 0.8rem 2rem;
      margin: 0 0.5rem;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      color: white;
      transition: background 0.3s ease;
    }
    .learn-more { background-color: #3b82f6; }
    .join-us { background-color: #ef4444; }
    button:hover { opacity: 0.9; }

    .circles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }
    .circle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, #3b82f6, transparent);
      animation: float 8s infinite ease-in-out;
      opacity: 0.5;
    }

    @keyframes float {
      from {
        transform: translateY(0) scale(0.5);
      }
      to {
        transform: translateY(-100vh) scale(1.5);
      }
    }
  </style>
</head>
<body>
  <div class="circles" id="circles"></div>

  <div class="container">
    <h1>Pleroma</h1>
    <p>Gradient animation with floating circles for a soothing effect.</p>
    <button class="learn-more">Learn More</button>
    <button class="join-us">Join Us</button>
  </div>

  <script>
    const circleContainer = document.getElementById('circles');
    for (let i = 0; i < 50; i++) {
      const circle = document.createElement('div');
      circle.classList.add('circle');
      const size = Math.random() * 100 + 50;
      circle.style.width = `${size}px`;
      circle.style.height = `${size}px`;
      circle.style.top = `${Math.random() * 100}%`;
      circle.style.left = `${Math.random() * 100}%`;
      circle.style.animationDuration = `${Math.random() * 10 + 5}s`;
      circle.style.animationDelay = `${Math.random() * 5}s`;
      circleContainer.appendChild(circle);
    }
  </script>
</body>
</html>
