<!DOCTYPE html>
<html lang="en" ng-app="galleryApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

  <title>Pleroma</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      height: 100vh;
      background: radial-gradient(circle, #0b132b, #1c2541);
      display: flex; 
      justify-content: center; 
      align-items: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      position: relative;
      z-index: 1;
    }
    h1 {
      font-size: 4rem;
      color: white;
      margin-bottom: 1rem;
    }
    p {
      color: #d1d5db;
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }
    button {
      padding: 0.8rem 2rem;
      margin: 0 0.5rem;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      color: white;
      transition: background 0.3s ease;
    }
    .learn-more { background-color: #3b82f6; }
    .join-us { background-color: #ef4444; }
    button:hover { opacity: 0.9; }

    .background-animation {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      z-index: 0;
    }
    .sphere {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.3), transparent);
      animation: float 10s infinite ease-in-out;
      opacity: 0.5;
      filter: blur(15px);
    }
    @keyframes float {
      0% { transform: translateY(0) translateX(0); }
      50% { transform: translateY(-500px) translateX(200px); }
      100% { transform: translateY(0) translateX(0); }
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .thumb {
      width: 150px;
      height: 100px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid #ddd;
      transition: 0.3s;
    }

    .thumb:hover {
      border-color: #333;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .preview-container {
      position: relative;
      max-width: 80%;
      max-height: 80%;
    }

    .preview-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    .nav-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 40px;
      color: white;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 50%;
      user-select: none;
    }

    .nav-button.left {
      left: -60px;
    }

    .nav-button.right {
      right: -60px;
    }

    .close-button {
      position: absolute;
      top: -50px;
      right: -60px;
      font-size: 30px;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body ng-controller="GalleryController">
  
  <div class="gallery">
    <div class="thumb" ng-repeat="image in images track by $index" ng-click="openPreview($index)">
      <img ng-src="{{image.url}}"  >
    </div>
  </div>

  <!-- Preview Overlay -->
  <div class="preview-overlay" ng-show="isPreviewOpen">
    <div class="preview-container">
      <span class="close-button" ng-click="closePreview()">&#10006;</span>
      <img ng-src="{{images[currentIndex].url}}" alt="{{images[currentIndex].title}}">
      <span class="nav-button left" ng-click="prevImage()" ng-show="currentIndex > 0">&#10094;</span>
      <span class="nav-button right" ng-click="nextImage()" ng-show="currentIndex < images.length - 1">&#10095;</span>
    </div>
  </div>
 <script>
    angular.module('galleryApp', [])
      .controller('GalleryController', function($scope) {
        $scope.images = [
         
        ];

        for(var i = 1; i<= 59;i++){
          $scope.images.push({url: "/gallery/" + i+".JPG"})
        }

        $scope.isPreviewOpen = false;
        $scope.currentIndex = 0;

        $scope.openPreview = function(index) {
          $scope.currentIndex = index;
          $scope.isPreviewOpen = true;
        };

        $scope.closePreview = function() {
          $scope.isPreviewOpen = false;
        };

        $scope.nextImage = function() {
          if ($scope.currentIndex < $scope.images.length - 1) {
            $scope.currentIndex++;
          }
        };

        $scope.prevImage = function() {
          if ($scope.currentIndex > 0) {
            $scope.currentIndex--;
          }
        };
      });
  </script>
</body>
</html>
